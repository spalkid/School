name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Загрузка кода
        uses: actions/checkout@v4

      - name: Подготовка папки с игрой
        run: |
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          rm -rf www/.git www/.github www/www

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установка Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настройка Capacitor и сборка Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MyGame" "com.school.mygame" --web-dir=www
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Загрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: my-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
