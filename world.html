<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Летунов — школьный район</title><style>
*{box-sizing:border-box}body{margin:0;background:#170f17;color:#f8e8c5;font-family:Georgia,serif}#wrap{max-width:1100px;margin:auto;padding:10px}h1{text-align:center;margin:5px}p{text-align:center;margin:4px 0 10px}canvas{width:100%;height:auto;display:block;border:4px solid #d6a65c;border-radius:12px;background:#b7c5bb;touch-action:none}.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px}.bar button,.touch button{background:#65333a;color:#fff1d2;border:2px solid #e0b36b;border-radius:12px;padding:10px 15px;font-weight:bold}.touch{display:flex;justify-content:space-between;gap:8px;position:sticky;bottom:4px}.touch div{display:flex;gap:8px}.touch button{min-width:55px;min-height:52px;font-size:18px;touch-action:none}.hint{text-align:center;font-size:14px;color:#e8cfa3}#shop{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center}#shop article{background:#2c1b22;border:3px solid #e0b36b;padding:22px;border-radius:16px;text-align:center;max-width:330px}#shop button{margin:5px;padding:10px;background:#65333a;color:white;border:1px solid #e0b36b;border-radius:8px}
</style></head><body><div id="wrap"><h1>ШКОЛЬНЫЙ РАЙОН</h1><p>Исследуй карту, забирайся на парты и найди Дениса</p><canvas id="c" width="960" height="540"></canvas><div class="bar"><button id="shopBtn">МАГАЗИН</button><button id="fightBtn">В БОЙ С ДЕНИСОМ</button><button onclick="location.href='index.html'">К ЛЕТУНОВУ</button></div><div class="hint">ПК: A/D или ←/→, Space — прыжок, E — взаимодействие, X — атака. Телефон: кнопки ниже. Розовые объекты можно парировать прыжком.</div><div class="touch"><div><button data-k="left">◀</button><button data-k="right">▶</button></div><div><button data-k="jump">ПРЫЖОК / ПАРИ</button><button data-k="attack">УДАР</button></div></div></div><div id="shop"><article><h2>Школьный буфет</h2><p>Монеты: <b id="coins">0</b></p><p>Сахарная булочка: +1 жизнь (3 монеты)</p><button id="buy">КУПИТЬ</button><button id="close">ЗАКРЫТЬ</button></article></div><script src="world.js"></script></body></html>
